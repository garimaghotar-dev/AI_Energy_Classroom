<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Classroom | AI Energy Saving Classroom</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="dashboard-page">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ⚡
            </div>

            <div>
                <h2>AI Energy</h2>
                <span>Saving Classroom</span>
            </div>

        </div>

        <nav>

            <a href="/classrooms" class="nav-item active">
                🏫 Classrooms
            </a>

            <a href="#" class="nav-item">
                ⚡ Energy
            </a>

            <a href="#" class="nav-item">
                📊 Analytics
            </a>

            <a href="#" class="nav-item">
                ⚙️ Settings
            </a>

        </nav>

        <div class="sidebar-bottom">

            <div class="system-status">
                <span class="status-dot"></span>
                System Online
            </div>

        </div>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <div class="form-page">

            <div class="form-header">

                <p class="eyebrow">
                    CLASSROOM SETUP
                </p>

                <h1>
                    Add Classroom
                </h1>

                <p class="page-description">
                    Add a classroom to start monitoring its energy usage.
                </p>

            </div>


            <div class="classroom-form-card">

                <form method="POST" action="/add-classroom">

                    <div class="form-group">

                        <label for="building">
                            Building / Block
                        </label>

                        <input
    type="text"
    id="building"
    name="building"
    placeholder="e.g. CB"
    required
>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="room">
                                Room Number
                            </label>

                            <input
    type="text"
    id="room"
    name="room"
    placeholder="e.g. 101"
    required
>

                        </div>


                        <div class="form-group">

                            <label for="floor">
                                Floor
                            </label>

                            <select id="floor" name="floor" required>
    <option value="">Select floor</option>
    <option>Ground Floor</option>
    <option>First Floor</option>
    <option>Second Floor</option>
    <option>Third Floor</option>
</select>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="capacity">
                            Classroom Capacity
                        </label>

                        <input
                            type="number"
                            id="capacity"
                            placeholder="e.g. 60"
                        >

                    </div>


                    <div class="form-actions">

                        <a
                            href="/classrooms"
                            class="cancel-btn"
                        >
                            Cancel
                        </a>

                        <button
                            type="submit"
                            class="save-btn"
                        >
                            Save Classroom
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>

</div>

</body>
</html>
